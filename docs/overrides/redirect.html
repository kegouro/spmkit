<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url={{ page.meta.redirect_to }}">
    <link rel="canonical" href="{{ page.meta.redirect_to }}">
    <title>{{ page.meta.title }} · {{ config.site_name }}</title>
  </head>
  <body>
    <main>
      <h1>{{ page.meta.title }}</h1>
      <p>This compatibility route has moved to the
        <a href="{{ page.meta.redirect_to }}">canonical page</a>.
      </p>
    </main>
  </body>
</html>
