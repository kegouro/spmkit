<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SPM-Kit · PDF reader · Pharos Project</title>
<link rel="icon" href="../brand/pharos.svg" type="image/svg+xml">
<script>
  function syncParentPalette() {
    try {
      const scheme = window.parent.document.body.getAttribute("data-md-color-scheme");
      document.documentElement.setAttribute("data-md-color-scheme", scheme || "slate");
    } catch (_) {
      document.documentElement.setAttribute(
        "data-md-color-scheme",
        window.matchMedia("(prefers-color-scheme: light)").matches ? "default" : "slate"
      );
    }
  }
  syncParentPalette();
</script>
<link rel="stylesheet" href="../../stylesheets/tokens.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body data-page="0">

<header class="spm-reader-toolbar">
  <h1 class="spm-reader-visually-hidden">SPM-Kit user guide PDF reader</h1>
  <span class="spm-reader-brand">
    <img class="spm-reader-mark" src="../brand/pharos.svg" alt="">
    <span>
      <span class="spm-reader-title">SPM-Kit · User Guide</span><br>
      <span class="spm-reader-subtitle">Pharos Project · instrument manual</span>
    </span>
  </span>

  <span class="spm-reader-spacer" aria-hidden="true"></span>

  <fieldset class="spm-reader-group">
    <legend class="spm-reader-visually-hidden">Pages</legend>
    <button id="prev"  title="Previous page (←)" aria-label="Previous page" type="button">‹</button>
    <span id="pagepill" class="spm-reader-value" aria-live="polite">0 / 0</span>
    <button id="next"  title="Next page (→)" aria-label="Next page" type="button">›</button>
  </fieldset>

  <fieldset class="spm-reader-group">
    <legend class="spm-reader-visually-hidden">Zoom</legend>
    <button id="zout"  title="Zoom out (−)" aria-label="Zoom out" type="button">−</button>
    <span id="zoompill" class="spm-reader-value" aria-live="polite">100%</span>
    <button id="zin"   title="Zoom in (+)" aria-label="Zoom in" type="button">+</button>
    <button id="fit"   title="Fit to width (W)" aria-label="Fit document to width" type="button" class="spm-reader-fit">⤢</button>
  </fieldset>

  <span class="spm-reader-separator" aria-hidden="true"></span>

  <button id="open"  title="Open in a new tab"       type="button">Open</button>
  <button id="download" title="Download PDF"         type="button" class="spm-reader-download">Download</button>
</header>

<!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the overflowing PDF page region must be keyboard-scrollable -->
<main id="scroll" tabindex="0" aria-label="Document pages">
  <div id="stack" aria-busy="true">
    <div class="spm-reader-loading" id="loading">Loading document…</div>
  </div>
</main>

<div id="fallback" class="hidden" role="alert" aria-live="assertive">
  <p><strong>The embedded viewer could not render this PDF.</strong></p>
  <p>You can open the guide directly in a new tab, or download it for offline reading.</p>
  <p>
    <a id="fallback-open" href="../../user-guide.pdf" target="_blank" rel="noopener">Open PDF in a new tab</a>
    &nbsp;·&nbsp;
    <a id="fallback-download" href="../../user-guide.pdf" download>User guide PDF</a>
  </p>
</div>

<script type="module">
import * as pdfjsLib from "./vendor/pdf.min.mjs";

try {
  const parentBody = window.parent.document.body;
  new MutationObserver(syncParentPalette).observe(parentBody, {
    attributes: true,
    attributeFilter: ["data-md-color-scheme"]
  });
} catch (_) {
  // The standalone reader already follows the operating-system preference.
}

pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdf.worker.min.mjs";

const scroll   = document.getElementById("scroll");
const stack    = document.getElementById("stack");
const loading  = document.getElementById("loading");
const fallback = document.getElementById("fallback");
const fOpen    = document.getElementById("fallback-open");
const fDown    = document.getElementById("fallback-download");
const prevB = document.getElementById("prev");
const nextB = document.getElementById("next");
const zoutB = document.getElementById("zout");
const zinB  = document.getElementById("zin");
const fitB  = document.getElementById("fit");
const openB = document.getElementById("open");
const dlB   = document.getElementById("download");
const pagepill = document.getElementById("pagepill");
const zoompill = document.getElementById("zoompill");

const fileUrl = new URL("../../user-guide.pdf", location.href).toString();
fOpen.href = fileUrl;
fDown.href = fileUrl;
openB.addEventListener("click", () => window.open(fileUrl, "_blank", "noopener"));
dlB.addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = fileUrl; a.download = "spmkit-user-guide.pdf";
  document.body.appendChild(a); a.click(); a.remove();
});

let pdf = null;
let scale = 1.0;
let fitScale = 1.0;
let pages = [];
let fitMode = true;
let renderGeneration = 0;
let pageObserver = null;

async function load() {
  try {
    const task = pdfjsLib.getDocument({ url: fileUrl });
    pdf = await task.promise;
    stack.innerHTML = "";
    pages = new Array(pdf.numPages);
    for (let i = 0; i < pdf.numPages; i++) {
      const wrap = document.createElement("div");
      wrap.className = "spm-reader-page";
      wrap.setAttribute("data-page", String(i + 1));
      const canvas = document.createElement("canvas");
      canvas.className = "spm-reader-canvas";
      wrap.appendChild(canvas);
      const num = document.createElement("div");
      num.className = "spm-reader-page-number";
      num.textContent = String(i + 1);
      wrap.appendChild(num);
      stack.appendChild(wrap);
      pages[i] = {
        wrap,
        canvas,
        pagep: null,
        viewport1: null,
        renderTask: null,
        renderQueue: Promise.resolve(),
        renderedScale: null
      };
    }
    pagepill.textContent = `0 / ${pdf.numPages}`;
    await fitWidth(true);
    pageObserver = new IntersectionObserver((entries) => {
      const generation = renderGeneration;
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const index = Number(entry.target.getAttribute("data-page")) - 1;
        for (const nearby of [index - 1, index, index + 1]) {
          if (nearby >= 0 && nearby < pages.length) {
            void renderPage(nearby, scale, generation).catch((error) => {
              console.error("[pdf-reader] page render failed:", error);
            });
          }
        }
      }
    }, { root: scroll, rootMargin: "100% 0px" });
    pages.forEach((page) => {
      pageObserver.observe(page.wrap);
    });
    stack.setAttribute("aria-busy", "false");
  } catch (err) {
    console.error("[pdf-reader] load failed:", err);
    stack.innerHTML = "";
    fallback.classList.remove("hidden");
  }
}

async function ensurePage(i) {
  const p = pages[i];
  if (!p.pagep) {
    p.pagep = await pdf.getPage(i + 1);
    p.viewport1 = p.pagep.getViewport({ scale: 1 });
  }
  return p;
}

function layoutPages(s) {
  for (const page of pages) {
    const viewport = page.pagep.getViewport({ scale: s });
    const width = Math.floor(viewport.width);
    const height = Math.floor(viewport.height);
    page.wrap.style.width = `${width}px`;
    page.wrap.style.height = `${height}px`;
    page.canvas.style.width = `${width}px`;
    page.canvas.style.height = `${height}px`;
  }
}

async function renderPage(i, s, generation) {
  const p = await ensurePage(i);
  const work = p.renderQueue.then(async () => {
    if (generation !== renderGeneration || p.renderedScale === s) return;
    const viewport = p.pagep.getViewport({ scale: s });
    const ctx = p.canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    p.canvas.width  = Math.floor(viewport.width  * dpr);
    p.canvas.height = Math.floor(viewport.height * dpr);
    p.canvas.style.width  = `${Math.floor(viewport.width)}px`;
    p.canvas.style.height = `${Math.floor(viewport.height)}px`;
    const task = p.pagep.render({
      canvasContext: ctx,
      viewport,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined
    });
    p.renderTask = task;
    try {
      await task.promise;
      if (generation === renderGeneration) p.renderedScale = s;
    } catch (error) {
      if (error?.name !== "RenderingCancelledException") throw error;
    } finally {
      if (p.renderTask === task) p.renderTask = null;
    }
  });
  p.renderQueue = work.catch(() => {});
  return work;
}

function visiblePageIndexes() {
  const root = scroll.getBoundingClientRect();
  const margin = scroll.clientHeight;
  const visible = [];
  for (let i = 0; i < pages.length; i++) {
    const rect = pages[i].wrap.getBoundingClientRect();
    if (rect.bottom >= root.top - margin && rect.top <= root.bottom + margin) {
      visible.push(i);
    }
  }
  return visible.length ? visible : [0];
}

async function renderVisible(s, generation) {
  await Promise.all(visiblePageIndexes().map((i) => renderPage(i, s, generation)));
}

function computeFitScale() {
  const avail = (scroll.clientWidth - 24);
  let s = 1.0;
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i];
    if (!p.viewport1) continue;
    s = Math.min(s, avail / p.viewport1.width);
  }
  return s;
}

async function fitWidth(initial) {
  for (let i = 0; i < pages.length; i++) await ensurePage(i);
  fitScale = computeFitScale() || 1.0;
  scale = fitScale;
  fitMode = true;
  const generation = ++renderGeneration;
  pages.forEach((page) => {
    page.renderedScale = null;
    if (page.renderTask) page.renderTask.cancel();
  });
  layoutPages(scale);
  await renderVisible(scale, generation);
  updateZoom();
  if (initial) updateCurrentPage();
}

function updateZoom() { zoompill.textContent = `${Math.round(scale * 100)}%`; }

function updateCurrentPage() {
  const probe = 80;
  let winner = 1;
  let best = Infinity;
  const viewportTop = scroll.getBoundingClientRect().top;
  for (let i = 0; i < pages.length; i++) {
    const r = pages[i].wrap.getBoundingClientRect();
    const distance = Math.abs(r.top - viewportTop - probe);
    if (distance < best) {
      best = distance;
      winner = i + 1;
    }
  }
  if (pages.length) pagepill.textContent = `${winner} / ${pages.length}`;
  document.body.setAttribute("data-page", String(winner));
  prevB.disabled = winner <= 1;
  nextB.disabled = winner >= pages.length;
}

scroll.addEventListener("scroll", updateCurrentPage, { passive: true });

async function applyZoom(s) {
  scale = Math.min(4, Math.max(0.2, s));
  fitMode = false;
  const generation = ++renderGeneration;
  pages.forEach((page) => {
    page.renderedScale = null;
    if (page.renderTask) page.renderTask.cancel();
  });
  layoutPages(scale);
  await renderVisible(scale, generation);
  updateZoom();
  updateCurrentPage();
}

zinB.addEventListener("click",  () => { void applyZoom(scale * 1.15); });
zoutB.addEventListener("click", () => { void applyZoom(scale / 1.15); });
fitB.addEventListener("click",  () => { void fitWidth(false); });

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (fitMode) {
      void fitWidth(false);
    } else {
      fitScale = computeFitScale() || fitScale;
    }
  }, 200);
});

prevB.addEventListener("click", () => {
  const cur = parseInt(document.body.getAttribute("data-page") || "1", 10);
  const target = Math.max(1, cur - 1);
  const wrap = pages[target - 1] && pages[target - 1].wrap;
  if (wrap) wrap.scrollIntoView({ block: "start", behavior: "smooth" });
});
nextB.addEventListener("click", () => {
  const cur = parseInt(document.body.getAttribute("data-page") || "1", 10);
  const target = Math.min(pages.length, cur + 1);
  const wrap = pages[target - 1] && pages[target - 1].wrap;
  if (wrap) wrap.scrollIntoView({ block: "start", behavior: "smooth" });
});

window.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "BUTTON" || t.tagName === "INPUT" || t.id === "scroll")) { return; }
  if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); nextB.click(); }
  else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); prevB.click(); }
  else if (e.key === "+") zinB.click();
  else if (e.key === "-") zoutB.click();
  else if (e.key === "w" || e.key === "W") fitB.click();
});

load();
</script>
</body>
</html>
