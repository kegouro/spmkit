name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install dev deps
        run: uv pip install -c requirements-reproducible.txt -e ".[dev]"
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Black (format check)
        run: uv run black --check src tests
      - name: Mypy (types)
        run: uv run mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv (Python ${{ matrix.python-version }})
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install package + test deps
        # Pin the validation stack. Native math kernels can still differ by platform.
        run: uv pip install -c requirements-reproducible.txt -e ".[dev,hdf5,gwy,report,jpk]"
      - name: Characterize derivative math backend and exact numerical brackets
        run: .venv/bin/python -m pytest tests/validation/test_derivative_platform.py -o addopts= -q -s
      - name: Run tests (core + ciencia; los de GUI se omiten sin Qt)
        run: uv run pytest

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Qt runtime libs (plataforma offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install package + GUI + test deps
        run: uv pip install -c requirements-reproducible.txt -e ".[dev,gui,test-gui,report,hdf5,gwy,jpk]"
      - name: Run GUI tests (offscreen, aislados por archivo)
        env:
          QT_QPA_PLATFORM: offscreen
          SPMKIT_SKIP_LEGACY_GUI: "1"  # smoke del MainWindow legacy segfaultea en teardown Linux
        run: uv run bash scripts/run_gui_tests.sh
