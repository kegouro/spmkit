site_name: SPM-Kit ecosystem
site_description: Open numerical analysis, interactive workflows, theory, and inspectable validation evidence for AFM, KPFM, and force spectroscopy
site_url: https://kegouro.github.io/spmkit/
site_author: José Labarca Baeza
copyright: Copyright © José Labarca Baeza · MIT-licensed software and documentation
repo_url: https://github.com/kegouro/spmkit
repo_name: kegouro/spmkit
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  favicon: assets/brand/pharos.svg
  logo: assets/brand/pharos.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/tokens.css
  - stylesheets/shell.css
  - stylesheets/components.css
  - stylesheets/scientific.css
  - stylesheets/responsive.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/accessibility.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started.md
      - Installation: getting-started/installation.md
      - First analysis: getting-started/first-analysis.md
      - Fathom quick start: getting-started/fathom-quick-start.md
      - Example workflows: ecosystem/workflows/index.md
  - Theory:
      - Overview: theory/index.md
      - AFM principles: theory/afm-principles.md
      - Operating modes: theory/operating-modes.md
      - Force-distance curves: theory/force-distance.md
      - Contact mechanics: theory/contact-mechanics.md
      - KPFM: theory/kpfm.md
      - Roughness: theory/roughness.md
      - Spectral analysis: theory/spectral-analysis.md
      - Resonance & mass sensing: theory/resonance.md
      - Implementation map: theory/spmkit-workflows.md
      - Glossary: theory/glossary.md
      - References: theory/references.md
  - User manual:
      - Overview: manual/index.md
      - Full guide: user-guide.md
      - PDF reader: manual/reader.md
      - Downloads: manual/downloads.md
      - CLI reference: cli.md
  - API: api.md
  - Ecosystem:
      - Overview: ecosystem/index.md
      - Choose a component: ecosystem/choose.md
      - Install matrix: ecosystem/install.md
      - Artifact contracts: ecosystem/contracts.md
      - Workflow walkthrough: ecosystem/workflows/index.md
      - SPM-Kit: ecosystem/spmkit.md
      - Fathom: ecosystem/fathom.md
      - Data Hunter: ecosystem/data-hunter.md
      - Phantoms: ecosystem/phantoms.md
      - Validation: ecosystem/validation.md
      - Pharos: ecosystem/pharos.md
      - Brand governance: ecosystem/brand.md
  - Scientific evidence:
      - Scientific status: SCIENTIFIC_STATUS.md
      - Validation campaigns: VALIDATION.md
      - Traceability: TRACEABILITY.md
      - Format maturity: FILE_FORMATS.md
      - Known limitations: KNOWN_LIMITATIONS.md
      - Reproducibility workflow: ecosystem/workflows/index.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Extending: extending.md
      - Roadmap: ROADMAP.md
      - Brand: BRAND.md
      - Acknowledgements: ACKNOWLEDGEMENTS.md
  - Contributing: CONTRIBUTING.md
  - Citation: CITATION.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kegouro/spmkit
      name: SPM-Kit on GitHub
    - icon: material/lighthouse
      link: https://kegouro.github.io
      name: Pharos Project
  status:
    type: alpha
