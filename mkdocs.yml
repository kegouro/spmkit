site_name: SPM-Kit · Fathom
site_description: Open numerical engine and interactive workspace for Scanning Probe Microscopy (SPM)
site_url: https://kegouro.github.io/spmkit
repo_url: https://github.com/kegouro/spmkit
repo_name: kegouro/spmkit
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  favicon: images/brand/fathom_mark.svg
  logo: images/brand/fathom_logo_light.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/fathom.css

extra_javascript:
  - javascripts/mathjax.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Theory:
      - Overview: theory/index.md
      - AFM principles: theory/afm-principles.md
      - Operating modes: theory/operating-modes.md
      - Force-distance curves: theory/force-distance.md
      - Contact mechanics: theory/contact-mechanics.md
      - KPFM: theory/kpfm.md
      - Roughness & spectral analysis: theory/roughness.md
      - Resonance & mass sensing: theory/resonance.md
      - SPM-Kit workflows: theory/spmkit-workflows.md
      - Glossary: theory/glossary.md
      - References: theory/references.md
  - Manual:
      - Overview: manual/index.md
      - Full guide: user-guide.md
      - PDF reader: manual/reader.md
      - Downloads: manual/downloads.md
      - CLI reference: cli.md
  - API: api.md
  - Ecosystem:
      - Overview: ecosystem/index.md
      - SPM-Kit: ecosystem/spmkit.md
      - Fathom: ecosystem/fathom.md
      - Phantoms: ecosystem/phantoms.md
      - Data Hunter: ecosystem/data-hunter.md
      - Validation: ecosystem/validation.md
      - Pharos: ecosystem/pharos.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Extending: extending.md
      - Validation: VALIDATION.md
      - Traceability: TRACEABILITY.md
      - Roadmap: ROADMAP.md
      - Brand: BRAND.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kegouro/spmkit
      name: SPM-Kit on GitHub
    - icon: material/lighthouse
      link: https://kegouro.github.io
      name: Pharos Project
  status:
    type: alpha
